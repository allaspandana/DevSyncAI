{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3>Update Task</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Form Errors -->
                        {% if form.errors %}

                        <div class="alert alert-danger">

                            {{ form.errors }}

                        </div>

                        {% endif %}

                        <!-- Form Fields -->
                        {{ form.as_p }}

                        <div class="mt-3">

                            <button type="submit" class="btn btn-primary">

                                Update

                            </button>

                            <a href="{% url 'task_list' %}" class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
