{% extends 'base.html' %}


{% block content %}


<div class="container mt-4">


<h2 class="mb-4">
Profile
</h2>



<div class="card p-4 shadow">


{% if user.profile_image %}

<img src="{{ user.profile_image.url }}"
     width="120"
     height="120"
     class="rounded-circle mb-3">

{% endif %}



<h4>
{{ user.username }}
</h4>



<p>
<b>Email:</b>
{{ user.email }}
</p>



<p>
<b>Role:</b>
{{ user.role }}
</p>



<p>
<b>Phone:</b>
{{ user.phone }}
</p>



<hr>



<div class="card p-3 mb-2 bg-light">

<h5>
Assigned Tasks
</h5>

<h3>
{{ task_count }}
</h3>

</div>




<div class="card p-3 bg-light">

<h5>
Assigned Bugs
</h5>

<h3>
{{ bug_count }}
</h3>

</div>



</div>


</div>


{% endblock %}
