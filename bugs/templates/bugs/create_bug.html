{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Create Bug</h3>
        </div>


        <div class="card-body">

            <form method="POST">

                {% csrf_token %}


                <!-- Task -->
                <div class="mb-3">
                    <label class="form-label">
                        Task
                    </label>

                    {{ form.task }}
                </div>



                <!-- Assigned Developer -->
                <div class="mb-3">

                    <label class="form-label">
                        Assigned To
                    </label>

                    {{ form.assigned_to }}

                </div>



                <!-- Title -->
                <div class="mb-3">

                    <label class="form-label">
                        Bug Title
                    </label>

                    {{ form.title }}

                </div>



                <!-- Description -->
                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    {{ form.description }}

                </div>



                <!-- Severity -->
                <div class="mb-3">

                    <label class="form-label">
                        Severity
                    </label>

                    {{ form.severity }}

                </div>



                <!-- Priority -->
                <div class="mb-3">

                    <label class="form-label">
                        Priority
                    </label>

                    {{ form.priority }}

                </div>



                <!-- Status -->
                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    {{ form.status }}

                </div>



                <!-- Resolved Date -->
                <div class="mb-3">

                    <label class="form-label">
                        Resolved Date
                    </label>

                    {{ form.resolved_date }}

                </div>



                <button type="submit" class="btn btn-success">
                    Create Bug
                </button>


                <a href="{% url 'bug_list' %}" 
                   class="btn btn-secondary">
                    Cancel
                </a>


            </form>

        </div>

    </div>

</div>


{% endblock %}
