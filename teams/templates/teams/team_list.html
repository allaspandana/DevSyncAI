{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">

        <h2 class="fw-bold text-primary">
            👥 Teams
        </h2>

        <a href="{% url 'create_team' %}"
           class="btn btn-primary">

            + Create Team

        </a>

    </div>

    <div class="card shadow-lg border-0">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th>Team</th>
                        <th>Leader</th>
                        <th>Members</th>
                        <th>Created</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

                    {% for team in teams %}

                    <tr>

                        <td>

                            <strong>{{ team.name }}</strong>

                        </td>

                        <td>{{ team.leader }}</td>

                        <td>

                            <span class="badge bg-success">

                                {{ team.members.count }}

                            </span>

                        </td>

                        <td>{{ team.created_at|date:"d M Y" }}</td>

                        <td>

                            <a href="{% url 'team_detail' team.id %}"
                               class="btn btn-info btn-sm">

                                View

                            </a>

                            <a href="{% url 'update_team' team.id %}"
                               class="btn btn-warning btn-sm">

                                Edit

                            </a>

                            <a href="{% url 'delete_team' team.id %}"
                               class="btn btn-danger btn-sm">

                                Delete

                            </a>

                        </td>

                    </tr>

                    {% empty %}

                    <tr>

                        <td colspan="5" class="text-center">

                            No Teams Available

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

<style>

body{

background:#eef3f8;

}

.card{

border-radius:18px;

}

table{

border-radius:18px;

overflow:hidden;

}

.btn{

border-radius:8px;

}

</style>

{% endblock %}
