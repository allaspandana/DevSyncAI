{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Sprint Details</h3>

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>

<th width="30%">Sprint Name</th>

<td>{{ sprint.name }}</td>

</tr>

<tr>

<th>Project</th>

<td>{{ sprint.project }}</td>

</tr>

<tr>

<th>Goal</th>

<td>{{ sprint.goal }}</td>

</tr>

<tr>

<th>Status</th>

<td>{{ sprint.status }}</td>

</tr>

<tr>

<th>Start Date</th>

<td>{{ sprint.start_date }}</td>

</tr>

<tr>

<th>End Date</th>

<td>{{ sprint.end_date }}</td>

</tr>

<tr>

<th>Created At</th>

<td>{{ sprint.created_at }}</td>

</tr>

</table>

<a href="{% url 'update_sprint' sprint.id %}"
class="btn btn-warning">

Edit

</a>

<a href="{% url 'sprint_list' %}"
class="btn btn-secondary">

Back

</a>

</div>

</div>

</div>

{% endblock %}
